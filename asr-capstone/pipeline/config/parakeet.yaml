# The same corpus, the same scoring, a different model.
#
# The whole point is that nothing here changes except the engine. Paths, the
# omitted-span thresholds and the three ways of normalising are all inherited, so
# a difference in the results is a difference between the models rather than
# between two experiments that happen to share a folder.
#
#   python -m scotus_asr.cli run --config config/parakeet.yaml --term 2017
#
# Results land in their own run folder and are named after the engine, so
# Whisper's numbers are not overwritten and the two sit side by side.

paths:
  sample_dir: "{scotus_corpus}/cases"
  runs_dir: "{scotus_corpus}/runs"

asr:
  engine: parakeet
  # Resolved to nvidia/parakeet-tdt-0.6b-v3 on the Hugging Face hub. The 0.6b
  # TDT model is the one the scoping survey lists at 6.34% average word error
  # rate, against Whisper large-v3 which leads that survey on long-form audio.
  # This project is entirely long-form, which is why the comparison is worth
  # making rather than reading off a leaderboard.
  model: parakeet-tdt-0.6b-v3
  device: cuda
  compute_type: float16
  language: en

  # Everything below this line belongs to Whisper and has no counterpart in
  # Parakeet. Left in so the two settings files can be read side by side, and
  # ignored by the engine rather than quietly faked into something.
  #
  #   beam_size, temperatures, compression_ratio_threshold,
  #   log_prob_threshold, no_speech_threshold, condition_on_previous_text
  #
  # vad_filter has no counterpart either, which matters: the Whisper run was
  # deliberately made with silence filtering off so the filter's mistakes were
  # not reported as the model's. Parakeet does no such filtering at all, so the
  # two are comparable on that point by default rather than by configuration.
  #
  # One thing Parakeet does need that is not a setting here: every stretch of 4
  # seconds or more with no word is decoded again on its own, because its decoder
  # can stop writing after a full stop. It is built into the engine, and recorded
  # on every result as gap_reread_seconds. See parakeet_engine.py and
  # findings/parakeet-stall/.
  word_timestamps: true
