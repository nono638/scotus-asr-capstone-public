[pytest]
# So `pytest` works from anywhere without the package being installed.
pythonpath = .
testpaths = tests
addopts = -q

markers =
    needs_data: uses the real sample PDFs, so it fails on a fresh clone until the
        files are fetched
    needs_model: would download or load a speech model and want a GPU. No test
        uses it yet; if one does, add `-m "not needs_model"` to addopts.
